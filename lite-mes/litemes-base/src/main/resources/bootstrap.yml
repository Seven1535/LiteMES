# Nacos 服务发现与配置中心地址
spring:
  application:
    name: litemes-base
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        # 生产环境：数据源等敏感配置收口到 Nacos 的 litemes-base.yml
        # 本地开发：使用本服务 application.yml 中的默认配置
        enabled: ${NACOS_CONFIG_ENABLED:false}
