# Nacos 服务发现与配置中心地址（环境变量 NACOS_ADDR 可覆盖）
spring:
  application:
    name: litemes-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      # Nacos 未开启鉴权（auth_enabled=false）时不要配 username/password，否则客户端登录报 user not found；
      # 开启鉴权后再通过环境变量 NACOS_USERNAME/NACOS_PASSWORD 注入
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        # 命名空间 litemes-dev；主配置 = litemes-gateway.yml（路由、白名单收口于此）
        namespace: ${NACOS_NAMESPACE:litemes-dev}
        enabled: ${NACOS_CONFIG_ENABLED:true}
        # 共享配置：Redis（黑名单查询）、JWT 密钥等公共项
        shared-configs:
          - data-id: litemes-common.yml
            refresh: true
