# 网关默认配置（本地开发用；生产环境路由与白名单收口到 Nacos 的 litemes-gateway.yml）
server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # 基础数据服务
        - id: litemes-base
          uri: lb://litemes-base
          predicates:
            - Path=/api/v1/base/**
        # 业务数据服务
        - id: litemes-production
          uri: lb://litemes-production
          predicates:
            - Path=/api/v1/prod/**
        # WebSocket 实时推送（由 production 服务承载）
        - id: litemes-production-ws
          uri: lb://litemes-production
          predicates:
            - Path=/ws/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# JWT 与鉴权（生产环境由 Nacos 覆盖）
litemes:
  jwt:
    secret: ${JWT_SECRET:litemes-default-secret-key-change-me-please}
  security:
    whitelist:
      - /api/v1/base/auth/login
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
